<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oxford 3000 Kartları</title>
  <meta name="description" content="Oxford 3000 kelimelerini aralıklı tekrar, görseller ve gerçek video sahneleriyle öğren.">
  <meta name="theme-color" content="#7c5cff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="Ana sayfa">
        <span class="brand-mark">3K</span>
        <span class="brand-name">Oxford 3000</span>
      </a>
      <div class="topbar-right">
        <a class="sync-dot" id="syncDot" href="#/settings" hidden></a>
        <span class="streak-pill" id="streakPill" title="Günlük seri">🔥 0</span>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Ana menü">
      <a href="#/home" data-tab="home"><span class="ti">🏠</span><span>Ana sayfa</span></a>
      <a href="#/study" data-tab="study"><span class="ti">🃏</span><span>Çalış</span></a>
      <a href="#/words" data-tab="words"><span class="ti">📚</span><span>Kelimeler</span></a>
      <a href="#/story" data-tab="story"><span class="ti">📖</span><span>Hikâye</span></a>
      <a href="#/stats" data-tab="stats"><span class="ti">📈</span><span>İstatistik</span></a>
      <a href="#/settings" data-tab="settings"><span class="ti">⚙️</span><span>Ayarlar</span></a>
    </nav>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-sheet" role="dialog" aria-modal="true">
      <button class="icon-btn modal-x" data-close aria-label="Kapat">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
